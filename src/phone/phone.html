<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>FreeCast Camera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e0e10; color: #f2f2f3; font: 15px -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  video.mirror { transform: scaleX(-1); }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; background: linear-gradient(#000a, #0000); }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #6b6b75; }
  #dot.live { background: #3ddc84; }
  #dot.wait { background: #ffb020; }
  #dot.bad { background: #ff4a3d; }
  #status { font-weight: 600; }
  #detail { margin-left: auto; color: #c9c9d1; font-size: 13px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px); display: flex; gap: 10px; background: linear-gradient(#0000, #000c); }
  /* Glass capsules, sized from the iOS kit: 48 high, semibold 17, accent blue. */
  button, select { flex: 1; min-width: 0; height: 48px; padding: 0 8px; border: 0; border-radius: 999px; color: #fff; font: 600 15px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: -.23px; text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04)), rgba(30, 30, 38, .55);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 0 0 1px rgba(255, 255, 255, .1), 0 8px 24px rgba(0, 0, 0, .3); }
  button:active { transform: scale(.97); }
  button.on { background: #0088ff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; background: #0e0e10; }
  #start h1 { margin: 0; font-size: 26px; }
  #start p { margin: 0; color: #9a9aa3; line-height: 1.45; max-width: 320px; }
  #go { flex: none; width: 240px; height: 50px; background: #0088ff; font-size: 17px; letter-spacing: -.43px; box-shadow: none; }  #err { color: #ff8a80; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="top"><span id="dot"></span><span id="status">Idle</span><span id="detail"></span></div>
<div id="bar">
  <button id="flip">Flip</button>
  <select id="quality">
    <option value="854x480">480p</option>
    <option value="1280x720">720p</option>
    <option value="1920x1080" selected>1080p</option>
    <option value="2560x1440">1440p</option>
    <option value="3840x2160">4K</option>
  </select>
  <select id="rate">
    <option value="24">24 fps</option>
    <option value="30" selected>30 fps</option>
    <option value="60">60 fps</option>
  </select>
  <button id="mic">Mic on</button>
</div>
<div id="start">
  <img src="/logo.svg" alt="" width="96" height="96">
  <h1>FreeCast Camera</h1>
  <p>This phone becomes the face cam and, if you want it, the microphone. Keep this tab open and the phone on the same Wi-Fi as the PC. Allow both camera and microphone when asked.</p>
  <button id="go">Start camera</button>
  <p id="err"></p>
</div>
<script>
(() => {
  const T = new URLSearchParams(location.search).get('t');
  const ID = Math.random().toString(36).slice(2, 10);
  const $ = (id) => document.getElementById(id);
  const v = $('v');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let stream = null, pc = null, facing = 'user', mic = true, hasMic = true, attempt = 0, retry = null, wake = null;

  function status(cls, text) {
    $('dot').className = cls;
    $('status').textContent = text;
  }

  async function send(msg) {
    const r = await fetch(`/api/send?t=${T}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: ID, msg }),
    });
    if (!r.ok) throw new Error('send failed');
  }

  async function pollLoop() {
    for (;;) {
      try {
        const r = await fetch(`/api/poll?t=${T}&id=${ID}`, { cache: 'no-store' });
        if (!r.ok) throw new Error('poll failed');
        for (const m of await r.json()) onMsg(m);
      } catch {
        await sleep(1500);
      }
    }
  }

  async function onMsg(m) {
    if (!pc) return;
    try {
      if (m.type === 'answer') await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      else if (m.type === 'candidate') await pc.addIceCandidate(m.candidate);
    } catch {}
  }

  async function getMedia() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    const [w, h] = $('quality').value.split('x').map(Number);
    // The mic always rides along so the PC can mix it in from its own side;
    // the Mic button here only mutes it. If mic access is refused, carry on
    // with video alone.
    const video = { facingMode: facing, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: +$('rate').value } };
    const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video, audio: hasMic ? audio : false });
    } catch (err) {
      if (!hasMic) throw err;
      hasMic = false;
      stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    }
    stream.getAudioTracks().forEach((t) => (t.enabled = mic));
    paintMic();
    const track = stream.getVideoTracks()[0];
    track.contentHint = 'motion';
    v.srcObject = stream;
    v.classList.toggle('mirror', facing === 'user');
    const s = track.getSettings();
    $('detail').textContent = `${s.width}x${s.height} ${Math.round(s.frameRate || 0)} fps`;
    // The phone remembers its own choices between visits.
    try { localStorage.setItem('freecast', JSON.stringify({ quality: $('quality').value, rate: $('rate').value, facing, mic })); } catch {}
  }

  async function tune() {
    for (const sender of pc.getSenders()) {
      if (!sender.track || sender.track.kind !== 'video') continue;
      try {
        const p = sender.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        const px = (sender.track.getSettings().width || 1920) * (sender.track.getSettings().height || 1080);
        p.encodings[0].maxBitrate = Math.max(2500000, Math.min(24000000, Math.round(px * 4))); // about 8 Mbps at 1080p
        p.degradationPreference = 'maintain-resolution';
        await sender.setParameters(p);
      } catch {}
    }
  }

  function scheduleRetry(ms) {
    clearTimeout(retry);
    retry = setTimeout(connect, ms);
  }

  async function connect() {
    clearTimeout(retry);
    const mine = ++attempt;
    if (pc) { pc.onconnectionstatechange = null; pc.close(); }
    pc = new RTCPeerConnection({ iceServers: [] });
    const me = pc;
    stream.getTracks().forEach((t) => me.addTrack(t, stream));
    me.onicecandidate = (e) => { if (e.candidate) send({ type: 'candidate', candidate: e.candidate.toJSON() }).catch(() => {}); };
    me.onconnectionstatechange = () => {
      if (mine !== attempt) return;
      const s = me.connectionState;
      if (s === 'connected') { status('live', 'Live'); tune(); clearTimeout(retry); }
      else if (s === 'connecting') status('wait', 'Connecting');
      else if (s === 'failed' || s === 'disconnected' || s === 'closed') { status('bad', 'Lost the PC, retrying'); scheduleRetry(2000); }
    };
    status('wait', 'Looking for the PC');
    try {
      const offer = await me.createOffer();
      await me.setLocalDescription(offer);
      await send({ type: 'offer', sdp: offer.sdp });
      scheduleRetry(8000); // cancelled once connected
    } catch {
      status('bad', 'PC not answering, retrying');
      scheduleRetry(3000);
    }
  }

  async function swapTracks() {
    await getMedia();
    if (!pc) return;
    const senders = pc.getSenders();
    for (const track of stream.getTracks()) {
      const sender = senders.find((s) => s.track && s.track.kind === track.kind);
      if (!sender) return connect();
      await sender.replaceTrack(track);
    }
    tune();
  }

  function paintMic() {
    $('mic').textContent = !hasMic ? 'No mic' : mic ? 'Mic on' : 'Mic muted';
    $('mic').classList.toggle('on', hasMic && mic);
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  $('go').onclick = async () => {
    try {
      await getMedia();
    } catch (e) {
      $('err').textContent = 'Camera blocked: ' + e.message;
      return;
    }
    $('start').style.display = 'none';
    keepAwake();
    pollLoop();
    connect();
  };
  $('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; swapTracks().catch(() => {}); };
  $('quality').onchange = () => swapTracks().catch(() => {});
  $('rate').onchange = () => swapTracks().catch(() => {});
  try {
    const saved = JSON.parse(localStorage.getItem('freecast') || '{}');
    if (saved.quality) $('quality').value = saved.quality;
    if (saved.rate) $('rate').value = saved.rate;
    if (saved.facing) facing = saved.facing;
    if (typeof saved.mic === 'boolean') mic = saved.mic;
  } catch {}
  $('mic').onclick = () => {
    if (!hasMic || !stream) return;
    mic = !mic;
    stream.getAudioTracks().forEach((t) => (t.enabled = mic));
    paintMic();
  };
  window.addEventListener('pagehide', () => { navigator.sendBeacon && navigator.sendBeacon(`/api/send?t=${T}`, JSON.stringify({ id: ID, msg: { type: 'bye' } })); });
})();
</script>
</body>
</html>
